# Cargo manifest for TypeIT.
# A Tauri v2 desktop window, the global-shortcut plugin (show/hide + a
# type-it accelerator), and enigo for delivering the reviewed transcript as
# keystrokes into whatever window you have focused. No screen-capture crates.
[package]
name = "typeit"
version = "0.1.8"
description = "TypeIT visual shell (frameless translucent widget)"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 splits the app into a lib (the real logic) and a thin main.rs.
# The staticlib/cdylib crate types are what the mobile targets expect; rlib
# keeps desktop builds simple. name must be a valid Rust identifier.
name = "typeit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: system-tray entry with a Quit item (so the app can be closed, not
# just hidden — a lingering instance would lock files and block upgrades).
tauri = { version = "2", features = ["tray-icon"] }
# Ensures only one TypeIT runs; a second launch focuses the existing window.
tauri-plugin-single-instance = "2"
# Registers OS-level global shortcuts (toggle THIS window + type-it trigger).
tauri-plugin-global-shortcut = "2"
# Cross-platform keystroke synthesis: types the reviewed text into the
# foreground window (Windows SendInput, macOS CGEvent, Linux X11/Wayland).
enigo = "0.2"
# Opens external URLs (the "Get a Deepgram API key" link) in the default browser.
tauri-plugin-opener = "2"
# Writes a log file (app log dir) so we can diagnose startup on the target OS.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: read the foreground window so typing can auto-stop when focus
# leaves the target app.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# Smaller, faster release binary — fits the "minimal footprint" goal.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
