# Cargo manifest for the Ghost Typer visual shell.
# Kept intentionally small: a Tauri v2 desktop window plus the global-shortcut
# plugin for a show/hide accelerator. No input-simulation / capture crates.
[package]
name = "ghost-typer-shell"
version = "0.1.0"
description = "Ghost Typer visual shell (frameless translucent widget)"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 splits the app into a lib (the real logic) and a thin main.rs.
# The staticlib/cdylib crate types are what the mobile targets expect; rlib
# keeps desktop builds simple. name must be a valid Rust identifier.
name = "ghost_typer_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Registers OS-level global shortcuts (used only to toggle THIS window).
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller, faster release binary — fits the "minimal footprint" goal.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
